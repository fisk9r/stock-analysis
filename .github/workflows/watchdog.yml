name: 定时看门狗（兜底触发）

# 作用：GitHub 的 schedule 是「尽力而为」，高负载时可能延迟甚至丢弃某次触发。
#   实测：盘前(09:02)、竞价(09:25) 被延迟 77~103 分钟，盘中异动(10:07/11:07…) 整段被跳过。
#   本看门狗在交易时段每整点 :30 探一次，并保留收盘/复盘两个关键窗口：
#     - 盘前 / 竞价 / 盘中异动：读状态包里的 push_log.jsonl，看「今天(北京)是否已推送过该 mode」，
#       没推且已过兜底阈值就代为触发，确保用户主渠道至少收到一次。
#     - 收盘完整分析：今天(北京)若还没有 mode=close 的推送记录，则触发 build（含 fetch+分析+推送+部署）。
#   安全：仅用默认 GITHUB_TOKEN（无需额外 PAT）；以「当日是否已推送」为去重依据，不重复轰炸。

on:
  schedule:
    - cron: '30 1-7 * * 1-5'   # 北京 09:30~15:30 每整点:30 探一次（覆盖盘前/竞价/盘中异动兜底）
    - cron: '30 9 * * 1-5'     # 北京 17:30 兜底「收盘完整分析」（晚于正常 16:10，避免与在跑任务抢跑）
    - cron: '35 12 * * 1-5'    # 北京 20:35 兜底「复盘补发」
  workflow_dispatch:
    inputs:
      task:
        description: '手动兜底的任务（空=按规则自动判定）'
        required: false
        default: ''
        type: choice
        options: ['', preauction, auction, anomaly, build]

permissions:
  actions: write   # 用于代为触发 stock.yml 的 workflow_dispatch
  contents: read   # 用于下载状态包（含 push_log.jsonl）

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 判定并兜底触发
        run: |
          set -u
          BH=$(TZ=Asia/Shanghai date +%H)
          DOW=$(TZ=Asia/Shanghai date +%u)   # 1=周一 … 7=周日
          if [ "$DOW" -ge 6 ]; then echo "周末，看门狗休眠"; exit 0; fi

          OWNER=fisk9r; REPO=stock-analysis
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)

          # 1) 取状态包（含 push_log.jsonl，记录今日已推送的 mode）
          GOT_STATE=0
          mkdir -p /tmp/wd && cd /tmp/wd
          if gh release download data-snapshot -p state.tar.gz -D . 2>/dev/null; then
            tar xzf state.tar.gz 2>/dev/null && GOT_STATE=1
          fi

          MODES=""
          if [ "$GOT_STATE" = "1" ] && [ -f dist/push_log.jsonl ]; then
            MODES=$(python3 - <<'PY'
          import json, datetime
          try:
              tz = datetime.timezone(datetime.timedelta(hours=8))
              today = datetime.datetime.now(tz).strftime("%Y-%m-%d")
              out = set()
              for line in open("dist/push_log.jsonl", encoding="utf-8"):
                  try:
                      p = json.loads(line)
                      if str(p.get("ts", "")).startswith(today):
                          out.add(p.get("mode"))
                  except Exception:
                      pass
              print("\n".join(sorted(out)))
          except Exception:
              pass
          PY
          )
          fi
          has() { printf '%s\n' "$MODES" | grep -qx "$1"; }

          DISPATCH=""
          # 2) 盘前 / 竞价 / 盘中异动：仅在已拿到历史状态包时兜底（无数据可推就不瞎触发）
          if [ "$GOT_STATE" = "1" ] && [ "$BH" -ge 9 ] && [ "$BH" -le 15 ]; then
            [ "$BH" -ge 10 ] && ! has preauction && DISPATCH="$DISPATCH preauction"
            [ "$BH" -ge 10 ] && ! has auction    && DISPATCH="$DISPATCH auction"
            [ "$BH" -ge 11 ] && ! has anomaly    && DISPATCH="$DISPATCH anomaly"
          fi
          # 3) 收盘完整分析：今天(北京)还没有 mode=close 的推送就触发 build（最完整，含部署）。
          #    阈值设在 17:00 之后，避免与正在运行的 16:10 正常任务抢跑（它还没推送完会被误判为缺失）。
          if [ "$BH" -ge 17 ] && ! has close; then
            DISPATCH="$DISPATCH build"
          fi

          if [ -z "$DISPATCH" ]; then
            echo "无需兜底：今日任务均已覆盖（已推送 mode = $(echo "$MODES" | tr '\n' ' ')）"
            exit 0
          fi

          for t in $DISPATCH; do
            echo "兜底触发任务：$t（当日已推送 mode = $(echo "$MODES" | tr '\n' ' ')）"
            gh workflow run stock.yml --ref main -f task="$t"
          done
