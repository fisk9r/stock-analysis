# 模拟盘执行器云端托管（2026-08-30 用户拍板：电脑不常开机且开机无网，
# 模拟盘必须全程跑在 GitHub Actions，网页端可见、本机零依赖）
#
# 任务（北京时间）：
#   09:25 开仓通道（竞价决策线裁决 + 风控 + 模拟下单）
#   盘中巡逻 15 轮（09:35/09:40/10:00/10:15/10:30/10:45/11:00/11:15/11:30/
#        13:15/13:30/13:45/14:00/14:15/14:30，2026-09-05 加密：
#        用户需求「交易时段全时段机动买卖」——巡逻轮内做持仓卖出裁决 +
#        chase_gate 盘中形态确认机动买入 + 熔断监控；无动作零推送）
#   14:43 尾盘确认通道（持仓管理 + 微红横盘入场）
#   15:32 复盘总结（盈亏归因 + 明日方案 + PushPlus 推送 + 回传网站模块）
#
# 状态持久化（runner 内置 exec_state_restore/save，走 Release data-snapshot 资产）：
#   sim.db / risk_state.json / notify_dedup.json / loss_streak.json / sim_review.json
#   打包为 executor_state.tar.gz 附件，运行前恢复、运行后回传（纯标准库实现）。
#   sim_review.json 额外推到仓库 state/（build.py 读它生成网站「模拟盘」模块），
#   并在复盘后 dispatch stock.yml build，让网页当晚就更新。
# 推送凭据：复用 stock.yml 的 NOTIFY_JSON Secret（PushPlus 多接收人）。
# 交易日判定：runner.is_trading_now 上证指数行情时间戳兜底（节假日整轮跳过）。
# 本机 .bat 计划任务保留作备用（开机时同样跑，RiskGate 幂等 + sim.db 单源防重）。
name: 模拟盘执行器（云端托管）

on:
  workflow_dispatch:
    inputs:
      task:
        description: '执行任务：now(开仓) / scan(巡逻) / tail(尾盘) / review(复盘)'
        required: true
        default: 'review'
        type: choice
        options: [now, scan, tail, review]
      force:
        description: '跳过交易日判定（手动测试用）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

  schedule:
    - cron: "25 1 * * 1-5"   # UTC 01:25 = 北京 09:25 开仓
    - cron: "28 1 * * 1-5"   # UTC 01:28 = 北京 09:28 开仓备份触发（2026-09-01：
    #        GitHub cron 曾实测漏投递/延迟 24 分钟，单点 09:25 可能整轮落空。
    #        账本幂等：09:25 成功则 09:28 查账直接跳过；09:25 失败/漏投则
    #        09:28 自动补跑（配合 runner「数据拉取失败不记账」重试语义））
    # ---- 盘中巡逻（2026-09-05 #484 加密：8 轮 → 15 轮，覆盖 09:35-14:30 全时段。
    #      用户需求：交易日交易时段全时段机动买卖——巡逻越密，盘中形态确认
    #      （chase_gate 微红横盘）越及时，买卖时点越贴近最优；
    #      幂等降频（10 分钟窗）+ 无动作零推送，密度不产生噪音）----
    - cron: "35 1 * * 1-5"   # UTC 01:35 = 北京 09:35 巡逻（早盘首轮）
    - cron: "40 1 * * 1-5"   # UTC 01:40 = 北京 09:40 巡逻
    - cron: "0 2 * * 1-5"    # UTC 02:00 = 北京 10:00 巡逻
    - cron: "15 2 * * 1-5"   # UTC 02:15 = 北京 10:15 巡逻
    - cron: "30 2 * * 1-5"   # UTC 02:30 = 北京 10:30 巡逻
    - cron: "45 2 * * 1-5"   # UTC 02:45 = 北京 10:45 巡逻
    - cron: "0 3 * * 1-5"    # UTC 03:00 = 北京 11:00 巡逻
    - cron: "15 3 * * 1-5"   # UTC 03:15 = 北京 11:15 巡逻
    - cron: "30 3 * * 1-5"   # UTC 03:30 = 北京 11:30 巡逻
    - cron: "15 5 * * 1-5"   # UTC 05:15 = 北京 13:15 巡逻（下午盘首轮）
    - cron: "30 5 * * 1-5"   # UTC 05:30 = 北京 13:30 巡逻
    - cron: "45 5 * * 1-5"   # UTC 05:45 = 北京 13:45 巡逻
    - cron: "0 6 * * 1-5"    # UTC 06:00 = 北京 14:00 巡逻
    - cron: "15 6 * * 1-5"   # UTC 06:15 = 北京 14:15 巡逻
    - cron: "30 6 * * 1-5"   # UTC 06:30 = 北京 14:30 巡逻
    - cron: "43 6 * * 1-5"   # UTC 06:43 = 北京 14:43 尾盘
    - cron: "32 7 * * 1-5"   # UTC 07:32 = 北京 15:32 复盘

permissions:
  contents: write
  # 2026-08-30：GITHUB_TOKEN 默认无 actions:write，触发 stock.yml dispatch 会报
  # 「Resource not accessible by integration」(HTTP 403)——CI 第三跑实测确认。
  actions: write

concurrency:
  group: executor
  cancel-in-progress: false   # 不取消排队——两次触发重叠时顺序执行保护 sim.db

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NOTIFY_JSON: ${{ secrets.NOTIFY_JSON }}
  # 2026-08-31 修复（致命根因）：此前缺失此 Secret，executor 在 CI 里 account 凭据
  # 全空（config.json 的 account 留空走 Secret 注入、config.local.json 已 gitignore 不上库）
  # → run_once/run_scan 入口「未配置 account，退出」→ now/scan/tail 全部静默跳过，
  # 这才是今天模拟盘 0 操作的最直接原因（cron 延迟+任务错配只是放大它）。
  # load_cfg 优先读 EXEC_ACCOUNT_JSON，其次回退 ALLOWED_USERS_JSON(owner.pass)。
  EXEC_ACCOUNT_JSON: ${{ secrets.EXEC_ACCOUNT_JSON }}
  ALLOWED_USERS_JSON: ${{ secrets.ALLOWED_USERS_JSON }}
  # runner 全部用 time.strftime 记日期（sim_review date/交易日判定），
  # CI 容器默认 UTC——北京时间 0-8 点手动 dispatch 会把日期写成前一天，必须固定时区
  TZ: Asia/Shanghai

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ---------- 1. 任务判定：dispatch 输入优先，schedule 按「触发的 cron」映射 ----------
      - name: 判定任务
        id: task
        run: |
          if [ -n "${{ github.event.inputs.task }}" ]; then
            echo "name=${{ github.event.inputs.task }}" >> $GITHUB_OUTPUT
          else
            # 2026-08-31 修复（重大）：此前用「运行时刻」的 UTC 小时反推任务。
            # GitHub cron 一旦延迟投递（已复现：09:25 开仓被拖到 15:07 才执行），
            # 运行时刻已是 07 点(UTC) → 任务被错配成 review，开仓/巡逻全部落空，
            # 表现为「模拟盘全天未操作、sim.db 四张表全空」。
            # 改为以「触发本次运行的 cron 表达式」为准（github.event.schedule），
            # 无论延迟多久，该跑开仓的仍跑开仓、该跑巡逻的仍跑巡逻。
            SCHED="${{ github.event.schedule }}"
            NAME=""
            if [ -n "$SCHED" ]; then
              # cron 表达式前两字段 = 分 时；如 "25 1 * * 1-5" → M=25 H=1
              CRON_M=$(echo "$SCHED" | awk '{print $1}')
              CRON_H=$(echo "$SCHED" | awk '{print $2}')
              case "$CRON_H" in
                1)  if [ "$CRON_M" -lt 30 ]; then NAME="now"; else NAME="scan"; fi ;;
                2|3|5) NAME="scan" ;;
                6)  if [ "$CRON_M" -lt 40 ]; then NAME="scan"; else NAME="tail"; fi ;;
                7)  NAME="review" ;;
                *)  NAME="" ;;
              esac
              echo "[判定] cron='$SCHED' → 任务=$NAME（延迟不影响映射）"
            fi
            if [ -z "$NAME" ]; then
              # 兜底：未登记的 cron / 非 schedule 触发，仍按运行时刻判定
              H=$(date -u +%H)
              M=$(date -u +%M)
              case "$H" in
                01) if [ "$M" -lt 30 ]; then NAME="now"; else NAME="scan"; fi ;;
                02|03|05) NAME="scan" ;;
                06) if [ "$M" -lt 40 ]; then NAME="scan"; else NAME="tail"; fi ;;
                *)  NAME="review" ;;
              esac
              echo "[判定] 无 cron 映射，按运行时刻 → 任务=$NAME"
            fi
            echo "name=$NAME" >> $GITHUB_OUTPUT
          fi
          echo "force=${{ github.event.inputs.force || 'false' }}" >> $GITHUB_OUTPUT

      # ---------- 2. 推送凭据落盘（NOTIFY_JSON Secret → config/notify.json） ----------
      - name: 注入推送凭据
        if: env.NOTIFY_JSON != ''
        run: |
          mkdir -p config
          printf '%s' "$NOTIFY_JSON" > config/notify.json
          echo "✅ notify.json 已注入（PushPlus 多接收人）"

      # ---------- 3. 执行（状态恢复/回存由 runner 内置 exec_state 完成） ----------
      # 注意：--force 由 main() 解析并透传，无需 heredoc（此前 heredoc 内缩进
      # 会被 Python 解析为 IndentationError，2026-08-30 已全部移除）。
      - name: 运行执行器（${{ steps.task.outputs.name }}）
        working-directory: tools/executor
        run: |
          TASK="${{ steps.task.outputs.name }}"
          FORCE="${{ steps.task.outputs.force }}"
          case "$TASK" in
            now)    ARGS="--now" ;;
            scan)   ARGS="--scan" ;;
            tail)   ARGS="--tail" ;;
            review) ARGS="--review" ;;
            *)      ARGS="--review" ;;
          esac
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "运行参数：python runner.py $ARGS"
          python runner.py $ARGS 2>&1 | tee run_log.txt
          # GITHUB_STEP_SUMMARY：CI 运行页直接可读摘要（手机查仓不用翻日志）
          {
            echo "## 模拟盘执行摘要（$(date '+%Y-%m-%d %H:%M' -d '+8 hours') 北京时间）"
            echo "- 任务：$TASK$( [ "$FORCE" = "true" ] && echo '（force 跳过交易日判定）')"
            echo ""
            echo '<details><summary>完整执行日志</summary>'
            echo ""
            echo '```'
            tail -n 120 run_log.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY" || true

      # ---------- 4. sim_review.json 推到仓库 state/ + 触发网站重建 ----------
      # 注意：不要在 run: | 块里用 heredoc——结束符顶格会截断 YAML 块标量
      # （YAML 把 PYEOF 当新映射键 → 解析失败 → workflow 注册不上 → dispatch 422）；
      # 缩进又不被 bash 认作结束符。改用 python -c 单行传参（GH Actions 环境）。
      - name: 回传网站模块数据
        if: always()
        env:
          TASK: ${{ steps.task.outputs.name }}
        run: |
          if [ ! -f tools/executor/sim_review.json ]; then
            echo "（无 sim_review.json，跳过回传）"; exit 0
          fi
          mkdir -p state
          cp tools/executor/sim_review.json state/sim_review.json
          python -c "import sys; sys.path.insert(0, 'tools'); import gh_api; gh_api.push_files('sim-review: executor CI auto-push', ['state/sim_review.json']); print('OK sim_review.json pushed')"
          # 复盘任务才触发网站重建（now/scan/tail 不动线上站点）
          if [ "$TASK" = "review" ]; then
            python tools/gh_api.py dispatch build
          fi
