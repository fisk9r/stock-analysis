name = "stock-analysis-admin"
main = "index.js"
compatibility_date = "2024-09-23"

# 非私密变量：直接写这里即可
[vars]
REPO = "fisk9r/stock-analysis"
ALLOW_ORIGIN = "https://stock-analysis-8zm.pages.dev"

# 私密变量（含 GitHub 令牌）请走命令行注入，切勿写进本文件：
