name: A股盘后分析流水线

# ============================================================================
# 时间换算：中国不使用夏令时，北京时间 = UTC + 8，恒定。
#   北京 08:50 → UTC 00:50      北京 15:20 → UTC 07:20
#   北京 09:25 → UTC 01:25      北京 20:00 → UTC 12:00
# 分钟刻意避开 :00，GitHub 整点排队最严重（可能延迟 5~30 分钟）。
#
# ⚠ 定时精度：GitHub 的 schedule 是"尽力而为"，高负载会延迟甚至丢弃。
#   收盘分析(16:10)、复盘(20:00) 延迟十几分钟无所谓，数据已定格；
#   集合竞价(09:25) 必须赶在 09:30 开盘前送达，对延迟零容忍——
#   建议改用外部调度器精确触发，见 DEPLOY-GITHUB.md「精确定时」。
#
# ⚠ 行情源：push2.eastmoney.com 对境外/云出口 IP 直接 RST 断连，GitHub runner
#   在境外必然命中。em_api 已内置自动降级到 push2delay.eastmoney.com
#   （盘中延迟约 15 分钟，盘后收盘数据完全一致）。国内节点部署可设
#   EM_PUSH2_HOST=push2.eastmoney.com 强制走实时。
#
# ⚠ 状态持久化：runner 每次都是全新机器，什么都不留。本项目有三份状态必须跨次续存：
#     cache/market.db        260 日 K 线
#     dist/data.js           最近一次分析结果，盘前/竞价/异动推送都靠它
#     state/push_ledger.jsonl  推送去重账本（权威，跨 run 续存），丢了会重复发、白烧 ServerChan 额度
#     dist/push_log.jsonl      上述账本的镜像（仅供本机看板展示，去重判定只看 state 账本）
#   统一存放在 tag = data-snapshot 的 Release 里，两个附件：
#     market.db.gz  state.tar.gz
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      task:
        description: '手动执行的任务'
        required: true
        default: 'build'
        type: choice
        options: [build, preauction, auction, open_anomaly, anomaly, close_again, weekend, yaogu]

  schedule:
    - cron: '50 0 * * 1-5'   # 北京 08:50 周一至周五 —— 盘前预判（前移：原 09:02，尽量早到）
    - cron: '25 1 * * 1-5'   # 北京 09:25 周一至周五 —— 集合竞价
    - cron: '26 1 * * 1-5'   # 北京 09:26 周一至周五 —— 竞价后开盘前异动（开盘前最后提醒）
    - cron: '50 1 * * 1-5'   # 北京 09:50 —— 盘中异动（提早首笔，开盘后第一时间捕捉）
    - cron: '7 2 * * 1-5'    # 北京 10:07 —— 盘中异动
    - cron: '7 3 * * 1-5'    # 北京 11:07 —— 盘中异动
    - cron: '7 5 * * 1-5'    # 北京 13:07 —— 盘中异动
    - cron: '7 6 * * 1-5'    # 北京 14:07 —— 盘中异动
    - cron: '7 7 * * 1-5'    # 北京 15:07 —— 盘中异动
    - cron: '20 7 * * 1-5'   # 北京 15:20 周一至周五 —— 收盘完整分析（前移：原 16:10）
    - cron: '40 7 * * 1-5'   # 北京 15:40 周一至周五 —— 妖股潜力榜（盘后，PushPlus 不限量）
    - cron: '0 12 * * 1-5'   # 北京 20:00 周一至周五 —— 复盘补发
    - cron: '0 12 * * 0'     # 北京 20:00 周日 —— 周末发酵（有则发，无则跳过）
    - cron: '0 0 * * 1'      # 北京 08:00 周一 —— 周末发酵（有则发，无则跳过）

# 同一时刻只允许一个流水线在跑。否则两个任务同时改数据库/状态，
# 后回存的会覆盖先回存的，去重记录直接丢失。
concurrency:
  group: stock-pipeline
  cancel-in-progress: false

permissions:
  contents: write   # 读写 Release asset（数据库与状态快照）
  actions: write    # 2026-08-31：补派 executor.yml（其自身 cron 被 GitHub 漏投递的冗余链）
  # 站点已改由 Cloudflare Pages 托管（仓库转私有后 GH Pages free 不可用），无需 pages/id-token 权限

env:
  DB_TAG: data-snapshot
  DB_FILE: market.db.gz
  STATE_FILE: state.tar.gz
  TZ: Asia/Shanghai
  # 外部 AI 模型密钥（换脑兜底）：仅在 config/models.json 填 key 或设此 Secret 时启用。
  # 不配置则 ai_judge 自动跳过，不影响主流程；Hy3 不可用只要有此 key 共识照常产出。
  # zhipu(GLM 免费档) 为保底：kimi 失败/超时时自动切换。
  AI_KIMI_KEY: ${{ secrets.AI_KIMI_KEY }}
  AI_ZHIPU_KEY: ${{ secrets.AI_ZHIPU_KEY }}
  PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      task: ${{ steps.task.outputs.task }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 本项目零第三方依赖（纯标准库），无需 pip install，省掉整个装包环节

      # ---------- 1. 决定本次跑什么 ----------
      - name: 解析任务类型
        id: task
        run: |
          S="${{ github.event.schedule }}"
          T="${{ github.event.inputs.task }}"
          if [ -n "$T" ]; then
            TASK="$T"
          else
            case "$S" in
              '50 0 * * 1-5')  TASK=preauction  ;;
              '25 1 * * 1-5')  TASK=auction     ;;
              '26 1 * * 1-5')  TASK=open_anomaly ;;
              '20 7 * * 1-5')  TASK=build       ;;
              '40 7 * * 1-5')  TASK=yaogu       ;;
              '0 12 * * 1-5')  TASK=close_again ;;
              '0 12 * * 0')    TASK=weekend     ;;
              '0 0 * * 1')     TASK=weekend     ;;
              *)               TASK=anomaly     ;;
            esac
          fi
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          # build / close_again 要重跑完整引擎，必须先抓当日最新行情
          case "$TASK" in
            build|close_again) echo "need_fetch=true"  >> "$GITHUB_OUTPUT" ;;
            *)                 echo "need_fetch=false" >> "$GITHUB_OUTPUT" ;;
          esac
          # 要闻：build/close_again 把新闻写进 data.js 供网站展示，weekend 靠它判断发不发
          case "$TASK" in
            build|close_again|weekend) echo "need_news=true"  >> "$GITHUB_OUTPUT" ;;
            *)                         echo "need_news=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "### 任务 \`$TASK\` · 北京时间 $(date '+%F %H:%M')" >> "$GITHUB_STEP_SUMMARY"

      # ---------- 2. 取回上次的状态 ----------
      - name: 恢复数据库与状态
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 瞬时故障重试（2026-08-31 修复）：GitHub API 偶发 503/502 曾直接把
          # 恢复/回存步骤打死（8-17 回存 503、8-27 恢复 404 各红 X 一次）。
          retry() { local n=1; while [ $n -le 3 ]; do "$@" && return 0; echo "⚠ 第 $n 次失败：$*，15s 后重试"; sleep 15; n=$((n+1)); done; return 1; }
          mkdir -p cache dist
          # 优先取整包；取不到再找分片（首次播种时本机网络差会走分片上传）
          if retry gh release download "$DB_TAG" -p "$DB_FILE" -D cache/ 2>/dev/null; then
            echo "整包快照已下载"
          elif retry gh release download "$DB_TAG" -p "$DB_FILE.part*" -D cache/parts/ 2>/dev/null; then
            N=$(ls cache/parts/ | wc -l)
            echo "检测到 $N 个分片，正在拼接…"
            cat $(ls cache/parts/$DB_FILE.part* | sort) > "cache/$DB_FILE"
            rm -rf cache/parts
            echo "拼接完成：$(du -h cache/$DB_FILE | cut -f1)"
          else
            echo "::error::找不到数据库快照。请在本机运行 tools/setup_github.py 把 market.db.gz 传到 tag 为 ${DB_TAG} 的 Release。"
            exit 1
          fi
          if ! gunzip -t "cache/$DB_FILE" 2>/dev/null; then
            echo "::error::快照文件损坏（gzip 校验失败），可能是上传中断。请重新上传。"
            exit 1
          fi
          gunzip -f "cache/$DB_FILE"
          echo "✅ 数据库已恢复：$(du -h cache/market.db | cut -f1)"
          # 状态包首次运行可以不存在（build 会自己生成），故不致命
          if gh release download "$DB_TAG" -p "$STATE_FILE" -D /tmp/ 2>/dev/null; then
            tar xzf "/tmp/$STATE_FILE" -C .
            echo "✅ 状态已恢复：data.js $( [ -f dist/data.js ] && echo 有 || echo 无 ) · 权威去重账本 $( [ -f state/push_ledger.jsonl ] && wc -l < state/push_ledger.jsonl || echo 0 ) 条 · 镜像 $( [ -f dist/push_log.jsonl ] && wc -l < dist/push_log.jsonl || echo 0 ) 条"
          else
            echo "⚠ 无历史状态包（首次运行正常）。推送去重从本次开始累积。"
          fi

      - name: 缺少 data.js 时中止纯推送任务
        # 盘前/竞价/周末推送都要读最近一次分析结果，没有就只能空转。
        # 妖股潜力榜(yaogu)只用实时涨停池、不读 data.js，故豁免此闸。
        if: steps.task.outputs.need_fetch == 'false' && steps.task.outputs.task != 'yaogu'
        run: |
          if [ ! -f dist/data.js ]; then
            echo "::error::dist/data.js 不存在。请先手动运行一次 task=build 生成分析结果。"
            exit 1
          fi

      # ---------- 3. 连通性自检（早失败，别留半截数据） ----------
      - name: 行情源自检
        # 必须注入推送凭据：探针会调 notifier.load_config() 统计 ServerChan/PushPlus 数量。
        # 不注入的话它永远读到 0 个，打出"⚠ 未读到任何推送凭据"——真丢凭据时也淹没在
        # 长期误报里，自检等于失效（实测 anomaly 那次日志：探针报 0 个，实际 PushPlus 成功 2/2）。
        env:
          NOTIFY_JSON: ${{ secrets.NOTIFY_JSON }}
        run: python tools/probe_net.py --quick

      # ---------- 4. 抓取最新行情 ----------
      # 本地是 update.bat 里 fetch.py → build.py 两步走，云端必须照搬，
      # 否则 build 永远在啃旧数据。fetch 内部会按 7 天有效期自动刷新板块成分。
      - name: 抓取当日行情
        if: steps.task.outputs.need_fetch == 'true'
        run: python pipeline/fetch.py

      # 周末发酵推送靠 news.json 判断"有没有料"。若这份文件是静态占位，
      # 云端周末推送会永久静默——看着一切正常，功能其实已经死了。
      # 所以每次用之前现抓，抓不到就跳过（不阻塞主流程）。
      - name: 抓取财经要闻
        if: steps.task.outputs.need_news == 'true'
        continue-on-error: true
        run: python pipeline/news_fetch.py --days 3

      # ---------- 5. 执行分析 / 推送 ----------
      - name: 写出访问人员配置（口令门禁，仅 build）
        if: steps.task.outputs.task == 'build'
        env:
          AU: ${{ secrets.ALLOWED_USERS_JSON }}
          HJ: ${{ secrets.HOLDINGS_JSON }}
          WJ: ${{ secrets.WATCH_JSON }}
        run: |
          if [ -n "$AU" ]; then printf '%s' "$AU" > config/allowed_users.json; echo "✅ 已写出访问人员配置"; else echo "⚠ 未配置 ALLOWED_USERS_JSON，站点将无加密数据（登录后提示无数据）"; fi
          if [ -n "$HJ" ]; then printf '%s' "$HJ" > config/holdings.json; echo "✅ 已写出持仓配置（持股监测）"; else echo "ℹ 未配置 HOLDINGS_JSON，持股监测为空（可在站点「持股监测」页编辑）"; fi
          if [ -n "$WJ" ]; then printf '%s' "$WJ" > config/watch.json; echo "✅ 已写出关注池配置（网页管理写回）"; else echo "ℹ 未配置 WATCH_JSON，关注池为空（可在站点「⭐ 管理关注股」页创建）"; fi

      - name: 执行流水线
        env:
          NOTIFY_JSON: ${{ secrets.NOTIFY_JSON }}   # 凭据只走 Secrets，仓库无明文
          HOLDINGS_JSON: ${{ secrets.HOLDINGS_JSON }}
          CLOUDFLARE_ACCOUNT_ID: dc99e973372018bc225135ff47ea8650   # AI 兜底（Workers AI）用
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          case "${{ steps.task.outputs.task }}" in
            build)       python pipeline/build.py ;;
            preauction)  python pipeline/build.py --preauction ;;
            auction)     python pipeline/build.py --auction-push ;;
            anomaly)     python pipeline/intraday.py || true; python pipeline/build.py --anomaly-push ;;
            close_again) python pipeline/build.py --push-close ;;
            weekend)     python pipeline/build.py --weekend-push ;;
            yaogu)       python pipeline/build.py --yaogu-push ;;
          esac

      # ---------- 5.5 加密数据（口令门禁） ----------
      - name: 加密数据（口令门禁）
        if: steps.task.outputs.task == 'build'
        run: |
          python pipeline/encrypt_data.py
          rm -f config/allowed_users.json   # 凭据仅运行时使用，不留痕

      # ---------- 6. 回存 ----------
      - name: 回存数据库
        if: steps.task.outputs.need_fetch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gzip -6 -c cache/market.db > "cache/$DB_FILE"
          retry() { local n=1; while [ $n -le 3 ]; do "$@" && return 0; echo "⚠ 第 $n 次失败：$*，15s 后重试"; sleep 15; n=$((n+1)); done; return 1; }
          retry gh release upload "$DB_TAG" "cache/$DB_FILE" --clobber
          echo "✅ 数据库已回存（$(du -h cache/$DB_FILE | cut -f1)）"
          # 整包已回存，首次播种用的分片就没用了，清掉免得下次误拼旧数据
          for a in $(gh release view "$DB_TAG" --json assets -q '.assets[].name' | grep -E "^$DB_FILE\.(part|manifest)" || true); do
            gh release delete-asset "$DB_TAG" "$a" -y && echo "已清理分片 $a"
          done

      - name: 回存状态
        # 任何任务都可能往 push_log.jsonl 追加记录，所以一律回存。
        # 用 always() 是因为：推送成功但后续步骤失败时，去重记录也不能丢。
        if: always() && steps.restore.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar czf "/tmp/$STATE_FILE" \
            $( [ -f dist/data.js ] && echo dist/data.js ) \
            $( [ -f state/push_ledger.jsonl ] && echo state/push_ledger.jsonl ) \
            $( [ -f dist/push_log.jsonl ] && echo dist/push_log.jsonl ) \
            $( ls dist/last_push_*.md 2>/dev/null ) \
            2>/dev/null || true
          if [ -f "/tmp/$STATE_FILE" ]; then
            retry() { local n=1; while [ $n -le 3 ]; do "$@" && return 0; echo "⚠ 第 $n 次失败：$*，15s 后重试"; sleep 15; n=$((n+1)); done; return 1; }
            retry gh release upload "$DB_TAG" "/tmp/$STATE_FILE" --clobber
            echo "✅ 状态已回存（$(du -h /tmp/$STATE_FILE | cut -f1)）"
          fi

      # ---------- 7. 打包站点（公开分析 data.js + 加密 blob + 用户列表） ----------
      - name: 打包站点
        if: steps.task.outputs.task == 'build'
        run: |
          rm -rf site && mkdir -p site
          # 逐个拷贝：默认 shell 是 bash -e，一次 cp 多文件只要缺一个整步就挂
          for f in index.html styles.css charts.js app.js auth.js nacl.js watchx.js stock_names.js users.json meta.json sw.js manifest.webmanifest icon.svg ai_narrative.json trend_buy_points.html; do
            if [ -f "dist/$f" ]; then cp "dist/$f" site/; else echo "::warning::缺少 dist/$f"; fi
          done
          # 目标必须写全 site/data；写成 site/ 会因目录已存在而变成 site/data/data
          if [ -d dist/data ]; then cp -r dist/data site/data; fi
          touch site/.nojekyll
          # 明文 data.js 不发布到公网——仅发布加密 blob（data/*.bin）与用户列表 users.json，
          # 访客必须凭授权口令解密后才能查看（verify_site.py 已将 data.js 列为"必须不存在"）。
          # 本地双击打开时若 dist/ 下存在明文 data.js，index.html 会自动加载并跳过登录（开发模式）。
          rm -f site/data.js.bak
          if [ ! -f site/users.json ] || [ -z "$(ls -A site/data 2>/dev/null)" ]; then
            echo "::error::加密数据缺失（users.json 或 data/*.bin）。检查 ALLOWED_USERS_JSON 密钥。"
            exit 1
          fi
          echo "✅ 站点文件：$(ls -A site | tr '\n' ' ')"
          echo "✅ 加密数据：$(ls site/data | tr '\n' ' ')"

      # ---------- 8. 部署到 Cloudflare Pages ----------
      # 仓库转私有后 GitHub Pages(free 账户)不可用，站点由 Cloudflare Pages 托管：
      # https://stock-analysis-8zm.pages.dev （项目已创建，production_branch=main）
      - name: 部署到 Cloudflare Pages
        if: steps.task.outputs.task == 'build'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dc99e973372018bc225135ff47ea8650
        run: npx wrangler@latest pages deploy site --project-name=stock-analysis --branch=main --commit-dirty=true

      - name: 部署后自动体检
        if: steps.task.outputs.task == 'build'
        continue-on-error: true
        run: |
          sleep 30  # 等 CF Pages CDN 生效
          python tools/verify_site.py https://stock-analysis-8zm.pages.dev

      # ---------- 9. 发布归因报告与盘中异动片段（Batch3 #11/#12）----------
      # 自动生成的 reports/rec_attr_<月>.html 与盘中异动片段 data/intraday_latest.json
      # 提交回仓库，使其可被查看（发布），并跨 CI 运行留存（喂 T+1）。
      - name: 发布归因报告与盘中异动片段
        if: steps.task.outputs.task == 'build'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/rec_attr_*.html data/intraday_latest.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无报告/异动变更，跳过提交"
          else
            git commit -m "chore: 自动归因报告/盘中异动片段 $(date +%F)"
            git push https://x-access-token:${GH_TOKEN}@github.com/fisk9r/stock-analysis.git HEAD:main
            echo "✅ 已发布归因报告与盘中异动片段"
          fi

      # ---------- 8. 失败可诊断 ----------
      - name: 失败时保留现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ steps.task.outputs.task }}-${{ github.run_id }}
          path: |
            dist/push_log.jsonl
            dist/last_push_*.md
            dist/data.js
            *.log
          retention-days: 7
          if-no-files-found: ignore

  # ---------- 9. 冗余触发模拟盘执行器（2026-08-31）----------
  # 背景：executor.yml 自己的 11 个 cron 实测被 GitHub 漏投递——2026-08-31 十个
  # 时点（09:25 开仓 + 8 轮巡逻 + 14:43 尾盘）一个都没送达，只有 06:43 那轮延迟
  # 24 分钟落到 07:07 UTC、被判定成 review，导致模拟盘整天零操作。
  # stock.yml 的触发源最多（自身 cron + 外部 15 分钟定时器 + watchdog +
  # scheduler-backup），拿它的每次运行顺手补派执行器，等于给模拟盘加第二条独立
  # 触发链。幂等由执行器侧「任务账本」保证（同一任务当日只执行一次，失败才重试），
  # 这里只做时段闸门——run_once 没有时段闸（只判交易日），开仓绝不能在收盘后被
  # 触发，否则会用收盘价建仓。
  dispatch-executor:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 按北京时段补派执行器任务
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Shanghai
        run: |
          set -e
          HM=$(date +%H:%M); DOW=$(date +%u)
          if [ "$DOW" -gt 5 ]; then echo "周末不派发执行器（$HM）"; exit 0; fi
          case "$HM" in
            # now 窗口放宽到 09:25-09:45：dispatch-executor 需等 run job（build 6-10 分钟）
            # 完成，外部 09:26 触发的 stock.yml 若 build 偏慢，完成时刻可能滑到 09:40+，
            # 原窗口 09:25-09:39 会错配成 scan。放宽后仍可靠派出开仓（早盘建仓仍合理），
            # 重复触发由执行器任务账本幂等拦截。
            09:2[5-9]|09:3[0-9]|09:4[0-5]) TASK=now ;;
            09:4[6-9]|1[0-3]:[0-5][0-9]|14:[0-3][0-9]) TASK=scan ;;
            14:4[0-9]|14:5[0-9]|15:0[0-9]) TASK=tail ;;
            15:[1-5][0-9]) TASK=review ;;
            *) echo "非模拟盘时段（$HM），跳过"; exit 0 ;;
          esac
          echo "补派执行器任务：$TASK（北京时间 $HM）"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/fisk9r/stock-analysis/actions/workflows/executor.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"task\":\"$TASK\",\"force\":\"false\"}}")
          echo "dispatch HTTP $code（204=已触发；重复触发由执行器账本幂等拦截）"

